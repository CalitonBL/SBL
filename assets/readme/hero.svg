<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SBL — a PCL-based Minecraft launcher with the download button restored</title>
  <desc id="desc">Dark hero with the SBL wordmark, the line “The download button is back.”, feature chips for Minecraft 1.20.1, Fabric, Forge, NeoForge and Windows x64, and an isometric stack of Minecraft blocks with an orange download block.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="0.55" stop-color="#0D1219"/>
      <stop offset="1" stop-color="#11161E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#F0782D" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#F0782D" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#F0782D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orangeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB06B"/>
      <stop offset="1" stop-color="#F0782D"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <g opacity="0.05" stroke="#8B949E" stroke-width="1">
    <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200M0 320H1200"/>
    <path d="M40 0V360M80 0V360M120 0V360M160 0V360M200 0V360M240 0V360M280 0V360M320 0V360M360 0V360M400 0V360M440 0V360M480 0V360M520 0V360M560 0V360M600 0V360M640 0V360M680 0V360M720 0V360M760 0V360M800 0V360M840 0V360M880 0V360M920 0V360M960 0V360M1000 0V360M1040 0V360M1080 0V360M1120 0V360M1160 0V360"/>
  </g>

  <g font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif">
    <text x="72" y="86" fill="#F0782D" font-size="13" font-weight="700" letter-spacing="3.2">PCL-BASED MINECRAFT LAUNCHER</text>
    <text x="64" y="184" fill="#F8FAFC" font-size="112" font-weight="800" letter-spacing="-3">SBL</text>
    <rect x="292" y="146" width="16" height="16" rx="3" fill="#F0782D"/>
    <text x="72" y="226" fill="#E6EDF3" font-size="27" font-weight="600">The download button is back.</text>
    <text x="72" y="258" fill="#9AA4B2" font-size="20">恢复原版、加载器与整合包下载 · PCL 2.x 界面</text>
  </g>

  <g font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12">
    <g>
      <rect x="72" y="286" width="70" height="28" rx="14" fill="#161B22" stroke="#30363D"/>
      <text x="107" y="304" fill="#C9D1D9" text-anchor="middle">1.20.1</text>
    </g>
    <g>
      <rect x="150" y="286" width="72" height="28" rx="14" fill="#161B22" stroke="#30363D"/>
      <text x="186" y="304" fill="#C9D1D9" text-anchor="middle">Fabric</text>
    </g>
    <g>
      <rect x="230" y="286" width="64" height="28" rx="14" fill="#161B22" stroke="#30363D"/>
      <text x="262" y="304" fill="#C9D1D9" text-anchor="middle">Forge</text>
    </g>
    <g>
      <rect x="302" y="286" width="86" height="28" rx="14" fill="#161B22" stroke="#30363D"/>
      <text x="345" y="304" fill="#C9D1D9" text-anchor="middle">NeoForge</text>
    </g>
    <g>
      <rect x="396" y="286" width="80" height="28" rx="14" fill="#161B22" stroke="#30363D"/>
      <text x="436" y="304" fill="#C9D1D9" text-anchor="middle">Win x64</text>
    </g>
  </g>

  <text x="72" y="338" fill="#6E7681" font-family="Cascadia Code, Consolas, monospace" font-size="12">v1.0.1   ·   Apache-2.0   ·   .NET 8 self-contained</text>

  <circle cx="930" cy="96" r="52" fill="#F0782D" opacity="0.12" filter="url(#soft)"/>

  <g opacity="0.55" filter="url(#soft)">
    <ellipse cx="930" cy="334" rx="118" ry="14" fill="#000000"/>
  </g>

  <g stroke="#0B0F14" stroke-width="4" stroke-linejoin="round">
    <polygon points="930,130 1050,190 930,250 810,190" fill="#6AB04C"/>
    <polygon points="810,190 930,250 930,330 810,270" fill="#8B5A2B"/>
    <polygon points="1050,190 930,250 930,330 1050,270" fill="#5E3C20"/>
  </g>

  <g fill="#A6D96A" opacity="0.35">
    <rect x="894" y="181" width="16" height="16" rx="3"/>
    <rect x="946" y="201" width="11" height="11" rx="2"/>
    <rect x="868" y="203" width="9" height="9" rx="2"/>
  </g>

  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M930 68V112"/>
    <path d="M906 90L930 116L954 90"/>
  </g>
  <g>
    <rect x="1052" y="150" width="120" height="36" rx="10" fill="#161B22" stroke="#30363D"/>
    <text x="1112" y="173" fill="#F2C14E" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1.20.1 · 621 MB</text>
  </g>
  <g opacity="0.7">
    <rect x="806" y="102" width="9" height="9" rx="2" fill="#6AB04C"/>
    <rect x="790" y="138" width="6" height="6" rx="1.5" fill="#F0782D"/>
    <rect x="1050" y="268" width="8" height="8" rx="2" fill="#6AB04C"/>
    <rect x="1074" y="288" width="5" height="5" rx="1.5" fill="#F2C14E"/>
  </g>
</svg>
